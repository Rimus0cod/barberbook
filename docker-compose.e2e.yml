services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: barberbook_e2e
      POSTGRES_USER: barberbook_e2e
      POSTGRES_PASSWORD: e2e-local-only-password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U barberbook_e2e -d barberbook_e2e"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - e2e-postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend
      target: development
    environment:
      NODE_ENV: test
      PORT: 3001
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: barberbook_e2e
      DB_USER: barberbook_e2e
      DB_PASSWORD: e2e-local-only-password
      DB_SYNCHRONIZE: "false"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: e2e-local-only-jwt-secret-not-for-deployment
      JWT_EXPIRES_IN: 7d
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: e2e-local-only-admin-password
      TELEGRAM_MODE: disabled
      FRONTEND_URL: http://localhost:${E2E_FRONTEND_PORT:-3300}
      BACKEND_PUBLIC_URL: http://localhost:${E2E_BACKEND_PORT:-3301}
      PAYMENT_PROVIDER: mock
      PAYMENT_RECONCILIATION_INTERVAL_MS: 300000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -c "npm run migration:run && npm run seed:demo && npm run start:dev"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O - http://127.0.0.1:3001/api/v1/health/ready | grep -q '\"status\":\"ok\"'",
        ]
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 30
    ports:
      - "127.0.0.1:${E2E_BACKEND_PORT:-3301}:3001"

  frontend:
    build:
      context: ./frontend
      target: development
    environment:
      VITE_API_URL: /api/v1
      VITE_DEV_PROXY_TARGET: http://backend:3001
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 20
    ports:
      - "127.0.0.1:${E2E_FRONTEND_PORT:-3300}:3000"

volumes:
  e2e-postgres-data:
